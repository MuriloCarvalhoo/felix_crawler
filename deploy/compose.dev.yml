# Postgres de desenvolvimento e testes do Felix.
# Uso: docker compose -f deploy/compose.dev.yml up -d
name: felix-dev

services:
  felix-db:
    image: postgres:18-alpine
    container_name: felix-db
    # Testes criam um banco e um pool por teste, em paralelo.
    command: ["postgres", "-c", "max_connections=300"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      TZ: UTC
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - felix-db-dados:/var/lib/postgresql
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-felix.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  felix-db-dados:
