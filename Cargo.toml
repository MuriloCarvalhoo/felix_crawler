[workspace]
resolver = "3"
members = ["crates/felix-core", "crates/felix-server"]

[workspace.package]
edition = "2024"
rust-version = "1.96"
version = "0.1.0"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
regex = "1"
felix-core = { path = "crates/felix-core" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
indexing_slicing = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
