[workspace]
resolver = "3"
members = ["crates/felix-core", "crates/felix-server", "crates/felix-transparencia"]

[workspace.package]
edition = "2024"
rust-version = "1.96"
version = "0.1.0"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
regex = "1"
felix-core = { path = "crates/felix-core" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "process", "fs", "io-util", "sync", "time", "macros"] }
tracing = "0.1"
uuid = { version = "1", features = ["v7", "serde"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
axum = { version = "0.8", features = ["multipart"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "trace", "timeout", "limit", "set-header", "request-id", "util"] }
argon2 = { version = "0.5", features = ["std"] }
rand = "0.9"
sha2 = "0.10"
base64 = "0.22"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls-tls", "builder", "hostname", "pool"] }
csv = "1"
tempfile = "3"
felix-transparencia = { path = "crates/felix-transparencia" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
indexing_slicing = "warn"

# Argon2 (m=19 MiB) em modo debug leva segundos por hash; otimiza só ele nos testes.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
