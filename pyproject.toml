[project]
name = "felix-crawler"
version = "0.0.0"
description = "Gestão de empenhos, notas fiscais e cobranças públicas"
requires-python = ">=3.14,<3.15"
dependencies = [
    "streamlit>=1.50,<2",
    "pydantic>=2.7,<3",
    "google-genai>=1.0,<2",
    "pymupdf>=1.24.3",
]

[dependency-groups]
test = ["pytest>=8.4", "pytest-cov>=6.0"]
dev = [{ include-group = "test" }, "ruff>=0.14"]

[tool.uv]
package = false
default-groups = ["dev"]
required-version = ">=0.13"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
